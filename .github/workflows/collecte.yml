name: collecte

# Collecte des sources, contrôles qualité, archivage des données brutes et proposition
# des tables préparées (docs/02-architecture.md, § 7).
#  - Sur main (planifié ou manuel) : ouvre une pull request de données « data/collecte-AAAA-MM-JJ ».
#  - Sur une autre branche (manuel) : commite les tables préparées sur cette branche.
#  - En cas d'échec des contrôles bloquants : rien n'est publié, une issue d'alerte est ouverte.

on:
  workflow_dispatch:
    inputs:
      jeux:
        description: "Jeux Eurostat à collecter, séparés par des espaces (vide = tous)"
        default: ""
        required: false
  schedule:
    # Chaque lundi à 5 h 17 UTC : Eurostat publie au fil de l'eau ; les jeux inchangés
    # produisent des tables identiques et aucune pull request.
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python et les dépendances
        run: |
          uv python install 3.12
          uv sync --python 3.12

      - name: Récupérer les instantanés déjà publiés
        run: uv run python scripts/donnees_brutes.py recuperer

      - name: Collecter Eurostat
        run: uv run python -m ingestion.sources.eurostat --ignorer-existants ${{ inputs.jeux }}

      - name: Construire le modèle et exécuter les contrôles qualité
        run: ./scripts/construire.sh

      - name: Archiver les instantanés bruts (Releases)
        run: uv run python scripts/donnees_brutes.py publier

      - name: Proposer les tables préparées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curated
          if git diff --cached --quiet; then
            echo "Tables préparées inchangées : rien à proposer."
            exit 0
          fi
          date_jour=$(date -u +%Y-%m-%d)
          message="data: collecte du ${date_jour}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            branche="data/collecte-${date_jour}"
            git switch -c "${branche}"
            git commit -m "${message}"
            git push -u origin "${branche}"
            gh pr create --base main --head "${branche}" \
              --title "${message}" \
              --body "Tables préparées issues de la collecte automatique du ${date_jour}. Contrôles qualité bloquants : passés. Détail dans le journal du workflow ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          else
            git commit -m "${message}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Conserver les données brutes pour diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: donnees-brutes-echec
          path: data/raw
          retention-days: 14

      - name: Ouvrir une issue d'alerte
        if: failure() && github.event_name == 'schedule'
        run: |
          gh issue create \
            --title "Échec de la collecte du $(date -u +%Y-%m-%d)" \
            --body "La collecte planifiée a échoué (source indisponible ou contrôle qualité bloquant). Journal : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
