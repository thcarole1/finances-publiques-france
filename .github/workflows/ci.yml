name: ci

# Contrôles exécutés sur chaque pull request et sur main.
# Le job « controles » est celui à rendre obligatoire dans la protection de branche (D10).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    name: controles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Installer Python et les dépendances
        run: |
          uv python install 3.12
          uv sync --python 3.12

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests unitaires (pytest)
        run: uv run pytest -q

      - name: Glossaire synchronisé avec docs/glossaire.md
        run: uv run python scripts/generer_glossaire.py --verifier

      - name: Rapport Power BI conforme aux schémas officiels (PBIR)
        run: |
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/microsoft/json-schemas "$RUNNER_TEMP/json-schemas"
          git -C "$RUNNER_TEMP/json-schemas" sparse-checkout set fabric/item/report
          uv run python scripts/valider_pbir.py --schemas "$RUNNER_TEMP/json-schemas"

      - name: Validation des scénarios (QC-B11)
        run: uv run python scripts/valider_scenarios.py

      - name: Construction du modèle et tests de données (dbt)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/construire.sh

  modele-powerbi:
    name: modele-powerbi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Installer .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Valider le modèle TMDL (bibliothèque Microsoft, comme Power BI Desktop)
        shell: bash
        run: |
          set +e
          dotnet run --project tools/valider_tmdl -- powerbi/FinancesPubliques.SemanticModel/definition \
            > sortie.txt 2>&1
          code=$?
          cat sortie.txt
          # Le message est aussi remonté en annotation (lisible dans l'onglet Checks de la PR).
          resume=$(grep -vE "^\s*$|warning NU|Restored|Determining" sortie.txt | tail -n 25 \
            | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          if [ $code -ne 0 ]; then echo "::error title=Modèle TMDL invalide::${resume}"; else echo "::notice title=Modèle TMDL::${resume}"; fi
          exit $code
