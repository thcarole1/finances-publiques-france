version: 2

seeds:
  - name: ref_sous_secteur
    description: >
      Sous-secteurs des administrations publiques (SEC 2010), avec la ligne d'élimination
      S13_ELIM qui porte la consolidation (voir docs/04-modele-dimensions.md).
    config:
      column_types:
        sous_secteur_code: varchar
        libelle: varchar
        libelle_court: varchar
        niveau: integer
        parent_code: varchar
        est_elimination: boolean
        ordre_tri: integer
        definition_courte: varchar
    columns:
      - name: sous_secteur_code
        data_tests: [unique, not_null]
      - name: est_elimination
        data_tests: [not_null]

  - name: ref_periodes_historiques
    description: Repères historiques affichés sur les graphiques temporels.
    config:
      column_types:
        periode_code: varchar
        libelle: varchar
        date_debut: date
        date_fin: date
    columns:
      - name: periode_code
        data_tests: [unique, not_null]

  - name: ref_pays
    description: Pays et agrégats, avec correspondances Eurostat et ISO3 (docs/04, Dim_Pays).
    config:
      column_types:
        pays_code: varchar
        code_eurostat: varchar
        code_iso3: varchar
        est_ue: boolean
        est_zone_euro: boolean
        est_ocde: boolean
        est_federal: boolean
        ordre_tri: integer
    columns:
      - name: pays_code
        data_tests: [unique, not_null]

  - name: ref_transaction
    description: Nature économique (feuilles SEC 2010) des recettes et des dépenses.
    data_tests:
      - unicite_grain:
          arguments: {colonnes: [libelle_court]}
      - unicite_grain:
          arguments: {colonnes: [libelle]}
    config:
      column_types: {transaction_code: varchar, ordre_tri: integer}
    columns:
      - name: transaction_code
        data_tests: [unique, not_null]
      - name: sens
        data_tests:
          - accepted_values:
              arguments: {values: ["Dépense", "Recette"]}
              config: {where: "transaction_code <> '_NA'"}

  - name: ref_formule_comptes_apu
    description: Formule de chaque feuille de Fait_Comptes_APU_Annuels à partir des postes de gov_10a_main.
    config:
      column_types: {transaction_code: varchar, na_item: varchar, coefficient: integer}
    columns:
      - name: transaction_code
        data_tests:
          - relationships:
              arguments: {to: ref('ref_transaction'), field: transaction_code}

  - name: ref_formule_depense_fonction
    description: Correspondance des postes de gov_10a_exp vers les feuilles de nature.
    config:
      column_types: {transaction_code: varchar, na_item: varchar, coefficient: integer}
    columns:
      - name: na_item
        data_tests: [unique]
      - name: transaction_code
        data_tests:
          - relationships:
              arguments: {to: ref('ref_transaction'), field: transaction_code}

  - name: ref_cofog
    description: Fonctions COFOG (feuilles de niveau 2 et résidus non ventilés).
    data_tests:
      - unicite_grain:
          arguments: {colonnes: [cofog_n2_libelle]}
    config:
      column_types:
        cofog_code: varchar
        niveau: integer
        est_non_ventile: boolean
        ordre_tri: integer
    columns:
      - name: cofog_code
        data_tests: [unique, not_null]

  - name: ref_prelevement
    description: Types de prélèvement (feuilles de gov_10a_taxag et résidus non ventilés).
    data_tests:
      - unicite_grain:
          arguments: {colonnes: [libelle_court]}
    config:
      column_types:
        prelevement_code: varchar
        est_prelevement_obligatoire: boolean
        est_non_ventile: boolean
        signe: integer
        ordre_tri: integer
    columns:
      - name: prelevement_code
        data_tests: [unique, not_null]

  - name: ref_formule_prelevement
    description: Formule de chaque feuille de prélèvement ; Σ feuilles = total publié par construction.
    config:
      column_types: {prelevement_code: varchar, na_item: varchar, coefficient: integer}
    columns:
      - name: prelevement_code
        data_tests:
          - relationships:
              arguments: {to: ref('ref_prelevement'), field: prelevement_code}

  - name: ref_source
    description: Sources de données, licences et attributions (docs/03).
    columns:
      - name: source_id
        data_tests: [unique, not_null]

  - name: ref_indicateur
    description: Indicateurs du rapport (paramètres de champ, révisions, info-bulles).
    config:
      column_types: {ordre_tri: integer}
    columns:
      - name: indicateur_code
        data_tests: [unique, not_null]

  - name: ref_fonction_economique
    description: >
      Bases économiques des prélèvements (méthodologie « Taxation Trends » de la DG TAXUD) et
      lecture du payeur : légale (qui verse) et économique (qui supporte).
    config:
      column_types: {fonction_code: varchar, ordre_tri: integer}
    columns:
      - name: fonction_code
        data_tests: [unique, not_null]

  - name: ref_fonction_defaut
    description: Base économique des prélèvements absents des listes nationales, justifiée.
    columns:
      - name: prelevement_code
        data_tests:
          - unique
          - relationships:
              arguments: {to: ref('ref_prelevement'), field: prelevement_code}
      - name: fonction_code
        data_tests:
          - relationships:
              arguments: {to: ref('ref_fonction_economique'), field: fonction_code}

  - name: ref_glossaire
    description: Glossaire pédagogique, généré depuis docs/glossaire.md (scripts/generer_glossaire.py).
    config:
      column_types: {glossaire_id: varchar, ordre_tri: integer}
    columns:
      - name: glossaire_id
        data_tests: [unique, not_null]
      - name: terme
        data_tests: [unique, not_null]

  - name: ref_instrument_dette
    description: Instruments de la dette publique (feuilles de gov_10dd_edpt1), libellés en clair.
    config:
      column_types: {instrument_code: varchar, na_item: varchar, ordre_tri: integer}
    columns:
      - name: instrument_code
        data_tests: [unique, not_null]

  - name: ref_detenteur
    description: Détenteurs de la dette publique (gov_10dd_ggd, contrepartie sector2), libellés en clair.
    config:
      column_types: {detenteur_code: varchar, sector2: varchar, ordre_tri: integer}
    columns:
      - name: detenteur_code
        data_tests: [unique, not_null]

  - name: ref_series_insee
    description: Séries de la BDM de l'INSEE utilisées par le modèle (identifiant IDBANK → usage).
    config:
      column_types: {idbank: varchar, jeu: varchar, usage: varchar, code: varchar}
    columns:
      - name: idbank
        data_tests: [unique, not_null]

  - name: ref_composante_dette_etat
    description: Composantes de la dette négociable de l'État, selon deux axes (durée, type de taux).
    config:
      column_types: {composante_code: varchar, ordre_tri: integer}
    columns:
      - name: composante_code
        data_tests: [unique, not_null]

  - name: ref_agregat_trimestriel
    description: Agrégats des comptes trimestriels des administrations publiques (gov_10q_ggnfa).
    config:
      column_types: {agregat_code: varchar, na_item: varchar, ordre_tri: integer}
    columns:
      - name: agregat_code
        data_tests: [unique, not_null]

  - name: ref_variable_prevision
    description: >
      Variables suivies dans les prévisions (Commission, FMI). sens_optimisme = +1 si une
      prévision trop haute est optimiste (solde, croissance), −1 si elle est pessimiste (dette).
    config:
      column_types: {variable_code: varchar, sens_optimisme: integer, code_ameco: varchar, code_fmi: varchar, ordre_tri: integer}
    columns:
      - name: variable_code
        data_tests: [unique, not_null]
