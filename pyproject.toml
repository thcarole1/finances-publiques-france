[project]
name = "finances-publiques-france"
version = "0.1.0"
description = "Modèle de données ouvert sur les finances publiques françaises, pour Power BI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "dbt-duckdb>=1.9",
    "pyarrow>=17",
    "polars>=1.9",
    "requests>=2.32",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
