version: 2

# Chaque table du modèle Power BI a un contrat appliqué (contract.enforced) :
# noms, types et contraintes des colonnes (QC-B01). Les faits ont un test d'unicité du grain
# (QC-B02) et des tests d'intégrité référentielle vers leurs dimensions (QC-B08).

models:
- name: dim_date
  description: Table de dates du modèle (marquée comme table de dates dans Power BI).
  config:
    contract:
      enforced: true
  columns:
  - name: date_id
    data_type: integer
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: date
    data_type: date
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: annee
    data_type: integer
  - name: trimestre
    data_type: integer
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 1
          - 2
          - 3
          - 4
          quote: false
  - name: mois
    data_type: integer
  - name: annee_trimestre
    data_type: varchar
  - name: annee_mois
    data_type: varchar
  - name: mois_libelle
    data_type: varchar
  - name: decennie
    data_type: varchar
  - name: est_fin_mois
    data_type: boolean
  - name: est_fin_trimestre
    data_type: boolean
  - name: est_fin_annee
    data_type: boolean
  - name: periode_historique_code
    data_type: varchar
  - name: periode_historique
    data_type: varchar
  - name: est_annee_disponible
    data_type: boolean
    description: Vrai si au moins un pays a des comptes annuels publiés pour cette année.
- name: dim_glossaire
  description: Glossaire pédagogique (source unique docs/glossaire.md).
  config:
    contract:
      enforced: true
  columns:
  - name: glossaire_id
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: terme
    data_type: varchar
  - name: definition_courte
    data_type: varchar
  - name: definition_longue
    data_type: varchar
  - name: ordre_tri
    data_type: integer
- name: dim_sous_secteur
  description: Sous-secteurs des administrations publiques et ligne d'élimination.
  config:
    contract:
      enforced: true
  columns:
  - name: sous_secteur_code
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - unique
  - name: libelle
    data_type: varchar
    constraints:
    - type: not_null
  - name: libelle_court
    data_type: varchar
  - name: niveau
    data_type: integer
  - name: parent_code
    data_type: varchar
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_sous_secteur')
          field: sous_secteur_code
  - name: est_elimination
    data_type: boolean
    constraints:
    - type: not_null
  - name: ordre_tri
    data_type: integer
  - name: definition_courte
    data_type: varchar
- name: fait_comptes_apu_annuels
  description: F01 — Feuilles de recettes et de dépenses par sous-secteur, avec éliminations (docs/05).
  config:
    contract:
      enforced: true
  columns:
  - name: pays_code
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_pays')
          field: pays_code
  - name: date_id
    data_type: integer
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_id
  - name: sous_secteur_code
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_sous_secteur')
          field: sous_secteur_code
  - name: transaction_code
    data_type: varchar
    constraints:
    - type: not_null
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_transaction')
          field: transaction_code
  - name: valeur_meur
    data_type: double
  - name: valeur_mnac
    data_type: double
  - name: statut_valeur
    data_type: varchar
  - name: source_id
    data_type: varchar
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_source')
          field: source_id
  - name: millesime_id
    data_type: varchar
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_millesime')
          field: millesime_id
  data_tests:
  - unicite_grain:
      arguments:
        colonnes:
        - pays_code
        - date_id
        - sous_secteur_code
        - transaction_code
